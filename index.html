<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factory Tasks</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --danger: #dc2626;
    --done-bg: #f0fdf4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181d;
      --card: #1f2228;
      --text: #e6e8eb;
      --muted: #9aa1ab;
      --border: #30343c;
      --accent: #60a5fa;
      --danger: #f87171;
      --done-bg: #14251b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181d;
    --card: #1f2228;
    --text: #e6e8eb;
    --muted: #9aa1ab;
    --border: #30343c;
    --accent: #60a5fa;
    --danger: #f87171;
    --done-bg: #14251b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 480px;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 4px 0;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 0 0 20px 0;
  }
  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    font-size: 1rem;
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); }
  button.add-btn {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }
  button.add-btn:hover { opacity: 0.9; }
  ul#task-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .task {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .task.done { background: var(--done-bg); }
  .task input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .task-text {
    flex: 1;
    word-break: break-word;
  }
  .task.done .task-text {
    text-decoration: line-through;
    color: var(--muted);
  }
  .delete-btn {
    background: none;
    border: none;
    color: var(--danger);
    font-size: 1.1rem;
    cursor: pointer;
    padding: 2px 6px;
    line-height: 1;
  }
  .empty-state {
    color: var(--muted);
    text-align: center;
    padding: 24px 0;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <div class="app">
    <h1>Factory Tasks</h1>
    <p class="subtitle">Version 1 &mdash; Add, complete, delete.</p>

    <div class="add-row">
      <input type="text" id="task-input" placeholder="Enter task..." maxlength="200">
      <button class="add-btn" id="add-btn">Add</button>
    </div>

    <ul id="task-list"></ul>
    <p class="empty-state" id="empty-state">No tasks yet. Add one above.</p>
  </div>

  <script>
    // Factory Tasks v1
    // All data lives in this browser's localStorage under this one key.
    // Nothing is sent to any server. Nothing is shared between devices.
    const STORAGE_KEY = "factory-tasks-v1";

    function loadTasks() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveTasks(tasks) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      } catch (e) {
        // Storage unavailable (e.g. private browsing) - fail silently, app still works this session.
      }
    }

    let tasks = loadTasks();

    const listEl = document.getElementById("task-list");
    const inputEl = document.getElementById("task-input");
    const addBtn = document.getElementById("add-btn");
    const emptyState = document.getElementById("empty-state");

    function render() {
      listEl.innerHTML = "";
      emptyState.style.display = tasks.length === 0 ? "block" : "none";

      tasks.forEach((task) => {
        const li = document.createElement("li");
        li.className = "task" + (task.done ? " done" : "");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.addEventListener("change", () => toggleTask(task.id));

        const span = document.createElement("span");
        span.className = "task-text";
        span.textContent = task.text;

        const delBtn = document.createElement("button");
        delBtn.className = "delete-btn";
        delBtn.textContent = "\u00d7";
        delBtn.setAttribute("aria-label", "Delete task");
        delBtn.addEventListener("click", () => deleteTask(task.id));

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(delBtn);
        listEl.appendChild(li);
      });
    }

    function addTask() {
      const text = inputEl.value.trim();
      if (!text) return;
      tasks.push({ id: Date.now().toString(), text, done: false });
      inputEl.value = "";
      saveTasks(tasks);
      render();
    }

    function toggleTask(id) {
      tasks = tasks.map((t) => (t.id === id ? { ...t, done: !t.done } : t));
      saveTasks(tasks);
      render();
    }

    function deleteTask(id) {
      tasks = tasks.filter((t) => t.id !== id);
      saveTasks(tasks);
      render();
    }

    addBtn.addEventListener("click", addTask);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") addTask();
    });

    render();
  </script>
</body>
</html>
