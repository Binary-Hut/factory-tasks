name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.factory/deploy-request.json'

permissions:
  contents: read

concurrency:
  group: production-deployment-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_NAME: ${{ github.event.repository.name }}
    steps:
      - name: Check out deployment request
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate approved source commit
        id: request
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(node -e "const request=require('./.factory/deploy-request.json'); const sha=String(request.source_sha || ''); if (!/^[0-9a-f]{40}$/.test(sha)) process.exit(1); process.stdout.write(sha)")"
          PARENT_SHA="$(git rev-parse HEAD^)"
          if [ "$SOURCE_SHA" != "$PARENT_SHA" ]; then
            echo "::error::The deployment request is not bound to its immediate approved source commit."
            exit 1
          fi
          git cat-file -e "$SOURCE_SHA^{commit}"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Approved source commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Check out exact approved source
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: git checkout --detach "$SOURCE_SHA"

      - name: Load deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .factory/deployment.json ]; then
            PROVIDER="$(node -e "const c=require('./.factory/deployment.json'); process.stdout.write(String(c.provider || ''))")"
            PROJECT_NAME="$(node -e "const c=require('./.factory/deployment.json'); process.stdout.write(String(c.project_name || ''))")"
            PRODUCTION_ACCESS="$(node -e "const c=require('./.factory/deployment.json'); process.stdout.write(String(c.production_access || ''))")"
            if [ "$PROVIDER" != "vercel" ]; then
              echo "::error::This workflow requires provider=vercel in .factory/deployment.json."
              exit 1
            fi
            if [ -n "$PROJECT_NAME" ]; then
              echo "VERCEL_PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"
            fi
            if [ -n "$PRODUCTION_ACCESS" ]; then
              echo "FACTORY_PRODUCTION_ACCESS=$PRODUCTION_ACCESS" >> "$GITHUB_ENV"
            fi
          fi

      - name: Verify deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Vercel deployment requires the VERCEL_TOKEN repository or organization secret."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@50.1.0

      - name: Verify Vercel project access
        shell: bash
        run: |
          set -euo pipefail
          if ! vercel project inspect "$VERCEL_PROJECT_NAME" --token "$VERCEL_TOKEN" >/dev/null 2>&1; then
            vercel link --yes --project "$VERCEL_PROJECT_NAME" --token "$VERCEL_TOKEN"
          else
            vercel link --yes --project "$VERCEL_PROJECT_NAME" --token "$VERCEL_TOKEN" >/dev/null
          fi
          test -f .vercel/project.json || {
            echo "::error::Vercel project linking did not create .vercel/project.json."
            exit 1
          }
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const project = JSON.parse(fs.readFileSync('.vercel/project.json', 'utf8'));
          if (!project.projectId || !project.orgId) {
            console.error('::error::.vercel/project.json did not include projectId/orgId.');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_ENV,
            'VERCEL_PROJECT_ID=' + project.projectId + '\nVERCEL_ORG_ID=' + project.orgId + '\n');
          NODE

      - name: Apply production access policy
        if: env.FACTORY_PRODUCTION_ACCESS == 'public'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const projectId = process.env.VERCEL_PROJECT_ID;
          const teamId = process.env.VERCEL_ORG_ID;
          const token = process.env.VERCEL_TOKEN;
          if (!projectId || !teamId || !token) {
            console.error('::error::Vercel project metadata is incomplete; cannot apply public production access policy.');
            process.exit(1);
          }
          const url = new URL('https://api.vercel.com/v9/projects/' + encodeURIComponent(projectId));
          url.searchParams.set('teamId', teamId);
          const response = await fetch(url, {
            method: 'PATCH',
            headers: {
              Authorization: 'Bearer ' + token,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ ssoProtection: null })
          });
          if (!response.ok) {
            const detail = await response.text().catch(() => '');
            console.error('::error::Could not disable Vercel Authentication for public production (' + response.status + '): ' + detail.slice(0, 500));
            process.exit(1);
          }
          console.log('Applied public production access policy: Vercel Authentication disabled.');
          NODE

      - name: Deploy approved main commit to production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          URL="$(vercel deploy --prod --yes --token "$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify public production access
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(mktemp)"
          trap 'rm -f "$BODY"' EXIT
          for attempt in {1..18}; do
            STATUS="$(curl -L -s -o "$BODY" -w '%{http_code}' "$DEPLOYMENT_URL")"
            if grep -qiE 'Log in to Vercel|vercel.*authentication' "$BODY"; then
              echo "::error::Production is behind Vercel Authentication. Disable project-level Vercel Authentication for public production verification, or add an explicit protected-site verification contract."
              exit 1
            fi
            if [ "$STATUS" = "200" ]; then
              echo "Production is publicly reachable." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" = "18" ]; then
              echo "::error::Production did not return HTTP 200 in time."
              exit 1
            fi
            sleep 10
          done

      - name: Run project production verification
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .factory/verify-production.sh ]; then
            chmod +x .factory/verify-production.sh
            ./.factory/verify-production.sh
          fi
