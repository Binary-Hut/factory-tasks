name: Run Tests

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install test tools
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test source code only
        run: npx playwright test tests/tasks.spec.js tests/console.spec.js
