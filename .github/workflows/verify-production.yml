name: Verify Production Site

on:
  push:
    branches: [ main ]

  workflow_dispatch:

jobs:
  verify-production:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install test tools
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for production site to become ready
        run: |
          URL="https://factory-tasks-eta.vercel.app"

          echo "Waiting for production deployment..."

          for attempt in {1..18}; do
            STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" "$URL")

            echo "Attempt $attempt: HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "Production site is responding successfully."
              exit 0
            fi

            sleep 10
          done

          echo "Production site did not become ready in time."
          exit 1

      - name: Test the live production site only
        run: npx playwright test tests/production.spec.js
