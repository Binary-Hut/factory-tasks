name: Codex Auto-Fix on Failure

on:
  workflow_run:
    workflows: ["Run Tests"]
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: codex-autofix-main
  cancel-in-progress: false

jobs:
  auto-fix:
    # Run only for a failed source test on main.
    # Do not auto-fix a commit that was itself created by github-actions[bot];
    # this prevents an expensive repair loop if Codex's fix is still wrong.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.actor.login != 'github-actions[bot]'

    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check OpenAI API key
        run: |
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "OPENAI_API_KEY is not configured." >&2
            exit 1
          fi

      - name: Get failing code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # Avoid spending API money if main has moved on since the failure.
      - name: Confirm failing commit is still current main
        id: current
        run: |
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          FAILED_SHA="${{ github.event.workflow_run.head_sha }}"

          if [ "$CURRENT_MAIN" = "$FAILED_SHA" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "The failed commit is still current main."
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Main has already changed. Skipping this repair to avoid wasted API spend."
          fi

      - name: Collect concise failed test output
        if: steps.current.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$FAILED_RUN_ID"             --repo "${{ github.repository }}"             --log-failed             | tail -n 120 > .codex-failure.log

      - name: Ask low-cost Codex for minimal fix
        if: steps.current.outputs.proceed == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5-mini
          effort: low
          permission-profile: ":workspace"
          prompt: |
            You are the low-cost repair agent for the tiny "Factory Tasks" project.

            Fix ONLY the specific source-test failure described in
            .codex-failure.log.

            Read only what you need:
            1. .codex-failure.log
            2. AGENTS.md
            3. PRODUCT.md
            4. the failing test file
            5. the application file directly related to that test

            Rules:
            - Make the smallest reasonable fix.
            - No general code review.
            - No refactoring unrelated code.
            - No new features.
            - No new dependencies, frameworks, backend, database, auth, or APIs.
            - Do not run npm install.
            - Do not install Playwright or Chromium.
            - Do not run the full test suite.
            - Do not commit, push, or create a PR.
            - If the cause is obvious from the failure and code, edit it immediately.
            - Stop after the minimal fix is applied.

      - name: Remove temporary failure log
        if: always()
        run: rm -f .codex-failure.log

      # Testing here costs GitHub Actions time, not OpenAI tokens.
      # It lets us safely skip a bot-created PR and its manual approval gate.
      - name: Set up Node.js for validation
        if: steps.current.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install test tools
        if: steps.current.outputs.proceed == 'true'
        run: npm install

      - name: Install Chromium
        if: steps.current.outputs.proceed == 'true'
        run: npx playwright install --with-deps chromium

      - name: Validate Codex repair
        if: steps.current.outputs.proceed == 'true'
        run: npx playwright test tests/tasks.spec.js

      - name: Commit validated repair directly to main
        if: steps.current.outputs.proceed == 'true'
        run: |
          if git diff --quiet; then
            echo "Codex made no code changes." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Auto-fix: resolve failing source tests [codex-autofix]"
          git push origin HEAD:main

      # Pushes made with GITHUB_TOKEN do not normally trigger push workflows.
      # Explicit dispatch keeps the normal status checks and production
      # verification without requiring a PAT or GitHub App.
      - name: Re-run source tests on repaired main
        if: steps.current.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --ref main

      - name: Verify repaired production deployment
        if: steps.current.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run verify-production.yml --ref main
