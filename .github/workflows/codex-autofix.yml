name: Codex Auto-Fix on Failure

on:
  workflow_run:
    workflows: ["Run Tests"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-fix:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check API key is available
        run: |
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "OPENAI_API_KEY secret is not set. Skipping auto-fix." >&2
            exit 1
          fi

      - name: Get the code from the failing commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Run Codex to diagnose and fix the failure
        uses: openai/codex-action@main
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            This repository is "Factory Tasks", a very simple single-file
            task manager (index.html only, no framework, no backend).
            Read AGENTS.md and PRODUCT.md first and follow their rules
            strictly - especially: do not add frameworks, backends,
            authentication, or any of the other out-of-scope items listed
            there.

            The GitHub Actions workflow "Run Tests" just failed on this
            commit. Run the test suite yourself (npm install, then
            npx playwright install --with-deps chromium, then
            npx playwright test), read the failure output, and apply the
            minimal code change needed to make all tests pass. Do not
            refactor unrelated code. Do not add new files unless strictly
            necessary. Just edit the files - do not attempt to commit,
            push, or open a pull request yourself.

      - name: Save the fix as a pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: codex-autofix/${{ github.event.workflow_run.head_sha }}
          title: "Automatic fix for failing tests"
          body: |
            This pull request was created automatically after the
            "Run Tests" workflow failed on commit
            ${{ github.event.workflow_run.head_sha }}.

            Please review the change carefully before merging.
          commit-message: "Auto-fix: resolve failing tests"
