name: Codex Feature Developer

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Feature branch to implement"
        required: true
        type: string
      plan_path:
        description: "Approved task plan file"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: codex-feature-developer-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check OpenAI API key
        run: |
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "OPENAI_API_KEY is not configured." >&2
            exit 1
          fi

      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Verify approved plan exists
        run: |
          test -f "${{ inputs.plan_path }}" || {
            echo "Plan file not found: ${{ inputs.plan_path }}" >&2
            exit 1
          }
          if grep -q "Status: READY_FOR_DEVELOPMENT" "${{ inputs.plan_path }}"; then
            echo "Approved first development attempt."
          elif grep -q "Status: READY_FOR_RETRY" "${{ inputs.plan_path }}"; then
            echo "Owner-approved retry."
          else
            echo "Plan must be READY_FOR_DEVELOPMENT or READY_FOR_RETRY." >&2
            exit 1
          fi

      - name: Mark developer stage active
        env:
          PLAN_PATH: ${{ inputs.plan_path }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path(os.environ["PLAN_PATH"])
          text = path.read_text()
          if "Status: READY_FOR_DEVELOPMENT" in text:
              text = text.replace("Status: READY_FOR_DEVELOPMENT", "Status: DEVELOPING", 1)
          elif "Status: READY_FOR_RETRY" in text:
              text = text.replace("Status: READY_FOR_RETRY", "Status: DEVELOPING", 1)
          else:
              raise SystemExit("Task is not in a startable state.")
          path.write_text(text)
          PY

      - name: Set up Node.js for deterministic validation
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install test tools
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Ask Codex Developer to implement approved plan
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5-mini
          effort: low
          permission-profile: ":workspace"
          prompt: |
            You are the Developer for Factory Tasks.

            Read these files before making changes:
            1. AI_POLICY.md
            2. AGENTS.md
            3. PRODUCT.md
            4. ARCHITECTURE.md
            5. .ai/roles/DEVELOPER.md
            6. ${{ inputs.plan_path }}

            Implement ONLY the approved plan in ${{ inputs.plan_path }}.

            Rules:
            - Follow AI_POLICY.md and AGENTS.md exactly.
            - Stay on the current feature branch.
            - Make the smallest reasonable implementation.
            - Do not add dependencies, frameworks, backend, database, auth, or APIs.
            - Update or add only the tests required by the approved plan.
            - Do not perform unrelated refactoring or review work.
            - Do not commit, push, merge, or create a pull request.
            - Do not run npm install.
            - Do not install browsers.
            - Stop once the implementation and matching tests are edited.

      - name: Ensure Codex made changes
        run: |
          if git diff --quiet; then
            echo "Codex made no changes." >&2
            exit 1
          fi
          git status --short

      - name: Run source tests
        run: npx playwright test tests/tasks.spec.js

      - name: Advance plan status after successful validation
        env:
          PLAN_PATH: ${{ inputs.plan_path }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path(os.environ["PLAN_PATH"])
          text = path.read_text()
          old = "Status: DEVELOPING"
          new = "Status: READY_FOR_REVIEW"

          if old not in text:
              raise SystemExit("Expected DEVELOPING status was not found.")

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit validated implementation to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement approved feature plan with Codex"
          git push origin HEAD:"${{ inputs.branch }}"


      - name: Pause task if developer stage fails
        if: failure()
        env:
          PLAN_PATH: ${{ inputs.plan_path }}
        run: |
          if [ ! -f "$PLAN_PATH" ]; then
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path
          import os

          path = Path(os.environ["PLAN_PATH"])
          text = path.read_text()
          if "Status: DEVELOPING" in text:
              text = text.replace("Status: DEVELOPING", "Status: PAUSED_AI_FAILURE", 1)
              path.write_text(text)
          PY

          if git diff --quiet -- "$PLAN_PATH"; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PLAN_PATH"
          git commit -m "Pause AI task after failed developer run"
          git push origin HEAD:"${{ inputs.branch }}" || true
