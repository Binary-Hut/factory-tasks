name: Local LLM Task Planner

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Task branch to plan"
        required: true
        type: string
      plan_path:
        description: "Task plan file"
        required: true
        type: string
      model:
        description: "Unused compatibility input; local model comes from LOCAL_LLM_MODEL"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: local-llm-task-planner-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: [self-hosted, factory-local-llm]
    timeout-minutes: 20
    env:
      LOCAL_LLM_ADAPTER: ${{ vars.LOCAL_LLM_ADAPTER || 'ollama' }}
      LOCAL_LLM_MODEL: ${{ vars.LOCAL_LLM_MODEL }}
      OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL || 'http://127.0.0.1:11434' }}
      LOCAL_LLM_HTTP_URL: ${{ vars.LOCAL_LLM_HTTP_URL }}
      LOCAL_LLM_HTTP_TOKEN: ${{ secrets.LOCAL_LLM_HTTP_TOKEN }}
    steps:
      - name: Check local LLM configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LOCAL_LLM_MODEL" || { echo "LOCAL_LLM_MODEL repository variable is required." >&2; exit 1; }
          case "$LOCAL_LLM_ADAPTER" in
            ollama|generic-http) ;;
            *) echo "LOCAL_LLM_ADAPTER must be ollama or generic-http." >&2; exit 1 ;;
          esac

      - name: Check out task branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify task needs planning
        shell: bash
        run: |
          set -euo pipefail
          test -f "${{ inputs.plan_path }}" || { echo "Plan file not found." >&2; exit 1; }
          grep -q "Status: NEEDS_PLANNING" "${{ inputs.plan_path }}" || {
            echo "Task must be NEEDS_PLANNING." >&2
            exit 1
          }

      - name: Build planner prompt
        shell: bash
        env:
          PLAN_PATH: ${{ inputs.plan_path }}
        run: |
          set -euo pipefail
          {
            echo "You are the Planner for ${{ github.repository }}."
            echo "Plan only the owner's task. Do not implement code or broaden scope."
            echo "Respect AI_POLICY.md, product scope, architecture, security, dependency, and deployment rules."
            echo "Return only the complete Markdown replacement for the task plan."
            echo "The document must contain a line exactly: Status: READY_FOR_APPROVAL"
            echo "Include scope, non-goals, affected areas, implementation steps, deterministic validation, risks/recovery, and acceptance criteria."
            for f in AI_POLICY.md AGENTS.md PRODUCT.md ARCHITECTURE.md ROADMAP.md .ai/roles/PLANNER.md "$PLAN_PATH"; do
              if [ -f "$f" ]; then
                printf "\n===== %s =====\n" "$f"
                cat "$f"
              fi
            done
          } > /tmp/local-planner-prompt.txt

      - name: Run local Planner
        shell: bash
        run: node .factory/local-llm-client.mjs "$LOCAL_LLM_ADAPTER" /tmp/local-planner-prompt.txt /tmp/local-plan.md

      - name: Validate and save proposed plan
        shell: bash
        env:
          PLAN_PATH: ${{ inputs.plan_path }}
        run: |
          set -euo pipefail
          cp /tmp/local-plan.md "$PLAN_PATH"
          grep -q "^Status: READY_FOR_APPROVAL$" "$PLAN_PATH" || {
            echo "Local Planner output did not produce an approval-ready plan." >&2
            exit 1
          }

      - name: Commit approval-ready plan
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.plan_path }}"
          git commit -m "Prepare task plan for owner approval"
          git push origin HEAD:"${{ inputs.branch }}"
